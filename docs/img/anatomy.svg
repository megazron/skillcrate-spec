<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<rect width="900" height="560" fill="#ffffff"/>
<text x="30" y="40" font-size="23" font-weight="700" fill="#1f2933">Anatomy of a skill package</text>
<text x="30" y="64" font-size="13" fill="#6b7580">One skill.yaml manifest carries the six properties a static-playback skill leaves implicit.</text>
<rect x="30" y="92" width="840" height="64" rx="9" fill="#e3f2f4" stroke="#0b7285" stroke-width="1.8"/>
<text x="48" y="119" font-size="16" font-weight="700" fill="#1f2933">identity</text>
<text x="48" y="142" font-size="12.5" fill="#6b7580" font-family="'Cascadia Code','Consolas',monospace">name · version (semver) · content id</text>
<text x="852" y="119" font-size="12.5" fill="#0b7285" text-anchor="end" font-style="italic">standardisation</text>
<rect x="30" y="168" width="840" height="64" rx="9" fill="#e3f2f4" stroke="#0b7285" stroke-width="1.8"/>
<text x="48" y="195" font-size="16" font-weight="700" fill="#1f2933">provenance</text>
<text x="48" y="218" font-size="12.5" fill="#6b7580" font-family="'Cascadia Code','Consolas',monospace">author · source · captured_on · episodes (hashed) · derived_from</text>
<text x="852" y="195" font-size="12.5" fill="#0b7285" text-anchor="end" font-style="italic">lineage you can trace</text>
<rect x="30" y="244" width="840" height="64" rx="9" fill="#e3f2f4" stroke="#0b7285" stroke-width="1.8"/>
<text x="48" y="271" font-size="16" font-weight="700" fill="#1f2933">embodiment + adaptation</text>
<text x="48" y="294" font-size="12.5" fill="#6b7580" font-family="'Cascadia Code','Consolas',monospace">source arm · joint_map · frame_transform · unit_conversion · requires</text>
<text x="852" y="271" font-size="12.5" fill="#0b7285" text-anchor="end" font-style="italic">portability as a contract</text>
<rect x="30" y="320" width="840" height="64" rx="9" fill="#fdf0e2" stroke="#b25a00" stroke-width="1.8"/>
<text x="48" y="347" font-size="16" font-weight="700" fill="#1f2933">safety</text>
<text x="48" y="370" font-size="12.5" fill="#6b7580" font-family="'Cascadia Code','Consolas',monospace">force / speed / clearance limits · preconditions · postconditions · verified</text>
<text x="852" y="347" font-size="12.5" fill="#b25a00" text-anchor="end" font-style="italic">checked before it moves</text>
<rect x="30" y="396" width="840" height="64" rx="9" fill="#e3f2f4" stroke="#0b7285" stroke-width="1.8"/>
<text x="48" y="423" font-size="16" font-weight="700" fill="#1f2933">composition</text>
<text x="48" y="446" font-size="12.5" fill="#6b7580" font-family="'Cascadia Code','Consolas',monospace">sequence of sub-skills · pre/postcondition handoff</text>
<text x="852" y="423" font-size="12.5" fill="#0b7285" text-anchor="end" font-style="italic">composed, not concatenated</text>
<rect x="30" y="472" width="840" height="64" rx="9" fill="#e8f5ec" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="48" y="499" font-size="16" font-weight="700" fill="#1f2933">integrity</text>
<text x="48" y="522" font-size="12.5" fill="#6b7580" font-family="'Cascadia Code','Consolas',monospace">sha256 of every payload file</text>
<text x="852" y="499" font-size="12.5" fill="#2b8a3e" text-anchor="end" font-style="italic">tamper-evident</text>
</svg>